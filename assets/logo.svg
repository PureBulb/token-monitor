<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#FBBC05" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box with 10% margin -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#tokenGrad)" stroke-width="2.5" />

  <!-- Speedometer / Gauge Arc -->
  <path d="M 36 78 A 30 30 0 1 1 92 78" fill="none" stroke="#45475A" stroke-width="6" stroke-linecap="round" />
  <path d="M 36 78 A 30 30 0 1 1 82 42" fill="none" stroke="url(#tokenGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central needle and pivot -->
  <circle cx="64" cy="68" r="5" fill="#CDD6F4" />
  <line x1="64" y1="68" x2="78" y2="48" stroke="#F38BA8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Digital Token / Pulse symbols -->
  <rect x="36" y="86" width="14" height="4" rx="2" fill="#89B4FA" />
  <rect x="54" y="86" width="20" height="4" rx="2" fill="#A6E3A1" />
  <rect x="78" y="86" width="14" height="4" rx="2" fill="#F9E2AF" />

  <!-- Sparkle / Lightning Bolt indicator -->
  <path d="M 64 24 L 60 33 L 65 33 L 61 41 L 69 31 L 64 31 Z" fill="#F9E2AF" />
</svg>
